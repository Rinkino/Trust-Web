<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="20" y1="26" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shield-clip">
      <path d="M32 4L8 14v18c0 14 10.5 26.5 24 30 13.5-3.5 24-16 24-30V14L32 4z"/>
    </clipPath>
  </defs>

  <!-- Shield base -->
  <path d="M32 4L8 14v18c0 14 10.5 26.5 24 30 13.5-3.5 24-16 24-30V14L32 4z"
    fill="url(#bg)" filter="url(#glow)"/>

  <!-- Inner shine overlay -->
  <path d="M32 4L8 14v18c0 14 10.5 26.5 24 30 13.5-3.5 24-16 24-30V14L32 4z"
    fill="url(#shine)" clip-path="url(#shield-clip)"/>

  <!-- Subtle border -->
  <path d="M32 4L8 14v18c0 14 10.5 26.5 24 30 13.5-3.5 24-16 24-30V14L32 4z"
    stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>

  <!-- Check mark -->
  <polyline points="20,33 28,41 44,25"
    stroke="url(#mark)" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"
    fill="none" filter="url(#glow)"/>
</svg>
