# EPL predictor pipeline: download -> validate -> features -> tune -> walk-forward
# backtest -> evaluate -> select -> predict -> persist to Supabase.
#
# Writes go through the epl-writer edge function, authenticated with this job's
# GitHub OIDC token. No database secret is stored in GitHub.
name: epl-pipeline

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip hyper-parameter tuning (use stored defaults)"
        type: boolean
        default: false
  push:
    paths:
      - epl/runs/pipeline.txt
  # Daily refresh. GitHub only runs schedules from the default branch.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: epl-pipeline
  cancel-in-progress: false

env:
  # Public, read-only key (RLS allows select only). Safe to publish.
  EPL_SUPABASE_URL: https://vezcwptlyyeqsaybhegv.supabase.co
  EPL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlemN3cHRseXllcXNheWJoZWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDk2NzAsImV4cCI6MjA5MDc4NTY3MH0.0fhbzVo596snx43qCO0oI5H1DBP26pP0wv-lgm32rIs

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: epl/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: epl/ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Run pipeline
        run: python -m eplpred.pipeline --download --out out --jobs 4 ${{ inputs.quick && '--quick' || '' }}
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-report-${{ github.run_id }}
          path: |
            epl/ml/out/*.csv
            epl/ml/out/summary.json
            epl/ml/out/live.json
          retention-days: 30
          if-no-files-found: ignore
