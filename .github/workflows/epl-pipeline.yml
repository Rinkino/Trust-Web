# Football predictor pipeline: download -> validate -> features -> tune -> walk-forward
# backtest -> evaluate -> select -> predict -> persist to Supabase.
#
# One job per league group runs in parallel; the groups that go live are listed in
# epl/runs/leagues.txt. Writes go through the epl-writer edge function, authenticated
# with the job's GitHub OIDC token. No database secret is stored in GitHub.
name: epl-pipeline

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip hyper-parameter tuning (use stored defaults)"
        type: boolean
        default: false
      groups:
        description: "League groups to run, space separated (e.g. 'EPL,ELC LALIGA'); empty = epl/runs/leagues.txt"
        type: string
        default: ""
      check_names:
        description: "Only list unrecognised team names (writes nothing)"
        type: boolean
        default: false
  push:
    paths:
      - epl/runs/pipeline.txt
  # Daily refresh. GitHub only runs schedules from the default branch.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: epl-pipeline
  cancel-in-progress: false

env:
  # Public, read-only key (RLS allows select only). Safe to publish.
  EPL_SUPABASE_URL: https://vezcwptlyyeqsaybhegv.supabase.co
  EPL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlemN3cHRseXllcXNheWJoZWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDk2NzAsImV4cCI6MjA5MDc4NTY3MH0.0fhbzVo596snx43qCO0oI5H1DBP26pP0wv-lgm32rIs

jobs:
  # Tests run once, in a job that cannot obtain an OIDC token, so no test can reach the database.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: epl/ml
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: epl/ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Plan league groups
        id: plan
        env:
          GROUPS_INPUT: ${{ inputs.groups }}
        run: |
          if [ -n "$GROUPS_INPUT" ]; then list="$GROUPS_INPUT"; else list=$(grep -v '^\s*#' ../runs/leagues.txt | tr '\n' ' '); fi
          echo "groups=$(python -c 'import json,sys; print(json.dumps(sys.argv[1:]))' $list)" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.tests.outputs.groups) }}
    defaults:
      run:
        working-directory: epl/ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: epl/ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check team names (writes nothing)
        if: ${{ inputs.check_names }}
        run: python -m eplpred.pipeline --download --check-names --competitions "${{ matrix.group }}"
      - name: Run pipeline
        if: ${{ !inputs.check_names }}
        run: python -m eplpred.pipeline --download --out out --jobs 4 --competitions "${{ matrix.group }}" ${{ inputs.quick && '--quick' || '' }}
      - name: Keep the run report
        if: ${{ always() && !inputs.check_names }}
        uses: actions/upload-artifact@v5
        with:
          name: epl-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            epl/ml/out/**/*.csv
            epl/ml/out/**/summary.json
            epl/ml/out/**/live.json
          retention-days: 30
          if-no-files-found: ignore
