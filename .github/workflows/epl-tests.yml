name: epl-tests

on:
  push:
    paths: ["epl/**", ".github/workflows/epl-*.yml"]
  pull_request:
    paths: ["epl/**", ".github/workflows/epl-*.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: epl/ml
    env:
      EPL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlemN3cHRseXllcXNheWJoZWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDk2NzAsImV4cCI6MjA5MDc4NTY3MH0.0fhbzVo596snx43qCO0oI5H1DBP26pP0wv-lgm32rIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: epl/ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
