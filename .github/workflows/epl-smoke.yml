# Checks the deployed web app from outside, as an anonymous visitor.
name: epl-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - epl/runs/smoke.txt
  workflow_run:
    workflows: [epl-pipeline]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://epl-predictor-psi.vercel.app
    steps:
      - name: Pages respond publicly with real content
        run: |
          set -u
          fail=0
          check() { # path, expected text
            code=$(curl -sS -L -o page.html -w "%{http_code}" --max-time 60 "$SITE$1")
            if [ "$code" = "200" ] && grep -q "$2" page.html; then echo "OK   $code $1"; else echo "FAIL $code $1 (expected: $2)"; head -c 400 page.html; echo; fail=1; fi
          }
          check "/"            "Upcoming Premier League matches"
          check "/advanced"    "Advanced statistics"
          check "/my-picks"    "My picks"
          check "/evaluation"  "Model evaluation"
          check "/predictions" "Upcoming predictions"
          check "/demo"        "Three-match demonstration"
          check "/history"     "Historical accuracy"
          check "/data"        "Data status"
          check "/api/export?model=selected&season=2025-26&target=outcome" "match_id,season,match_date"
          # The API must reject bad input
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -d '{"mode":"nope"}' "$SITE/api/demo")
          [ "$code" = "400" ] && echo "OK   400 /api/demo rejects invalid mode" || { echo "FAIL /api/demo returned $code for invalid mode"; fail=1; }
          # The demo button end to end: create a run, then open its page
          curl -sS -X POST -H 'content-type: application/json' -d '{"mode":"auto"}' "$SITE/api/demo" > demo.json; cat demo.json; echo
          run_id=$(python3 -c "import json; print(json.load(open('demo.json')).get('run_id') or '')")
          if [ -n "$run_id" ]; then check "/demo/$run_id" "Random seed"; else echo "FAIL /api/demo did not create a run"; fail=1; fi
          # A match page from the home page, with the model's prediction and its explanation
          match=$(curl -sS "$SITE/" | grep -o 'href="/match/[^"]*"' | head -1 | sed 's/href="//; s/"$//')
          if [ -n "$match" ]; then
            check "$match" "Why the model thinks this"
            mid=${match#/match/}
            # Picks round trip with a throwaway key: save, list, then remove
            key=$(openssl rand -hex 32)
            post() { curl -sS -X POST -H 'content-type: application/json' -d "$1" "$SITE/api/picks"; }
            out=$(post "{\"action\":\"save\",\"key\":\"$key\",\"match_id\":\"$mid\",\"pick\":\"D\",\"home_goals\":1,\"away_goals\":1}"); echo "save: $out"
            echo "$out" | grep -q '"saved"' || { echo "FAIL pick save"; fail=1; }
            out=$(post "{\"action\":\"list\",\"key\":\"$key\"}"); echo "list: $(echo "$out" | head -c 300)"
            echo "$out" | grep -q "\"match_id\":\"$mid\"" || { echo "FAIL pick list"; fail=1; }
            out=$(post "{\"action\":\"clear\",\"key\":\"$key\",\"match_id\":\"$mid\"}"); echo "clear: $out"
            echo "$out" | grep -q '"cleared"' || { echo "FAIL pick clear"; fail=1; }
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -d '{"action":"list","key":"nope"}' "$SITE/api/picks")
            [ "$code" = "400" ] && echo "OK   400 /api/picks rejects a bad key" || { echo "FAIL /api/picks returned $code for a bad key"; fail=1; }
          else
            echo "FAIL no match link on the home page"; fail=1
          fi
          echo "--- dashboard numbers ---"
          curl -sS "$SITE/" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -o "Historical matches [^A-Z]*\|Eligible upcoming fixtures [0-9]*\|Seasons covered [0-9]*" || true
          exit $fail
