# Download-only data checks (prints what sources contain; writes nothing).
name: epl-probe

on:
  workflow_dispatch:
  push:
    paths:
      - epl/runs/probe.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: epl/ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: epl/ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: European cups data check
        run: python -m eplpred.probe_cups
